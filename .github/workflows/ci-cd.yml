name: student-management ci-cd

on:
  push:
    branches:
      - master

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Buld Stage
        run: mvn clean package

      - name: Configure aws credentials 
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Push Artifacts to s3
        run: aws s3 cp target/*.war s3://abhishek54321.space/Artifacts/student.war

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mnv sonar:sonar \
            -Dsoanr.token="$SONAR_TOKEN" \
            -Dsoanr.host.url="$SONAR_HOST_URL"

      - name: SonarQube Quality Gates
        run: |
          docker build -t student .
          docker images

      - name: Trivy Install 
        run: |
          sudo apt-get update
          sudo apt-get install -y wget 
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Image Using Trivy 
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 student:latest
      
